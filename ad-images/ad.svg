<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <!-- Accent gradients -->
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe66d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffe66d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe66d"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#f06595"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="0" cy="0" r="320" fill="url(#blob1)"/>
  <circle cx="1920" cy="1080" r="380" fill="url(#blob2)"/>
  <circle cx="1750" cy="260" r="260" fill="url(#blob3)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.06" fill="#fff">
    <!-- a few dots -->
  </g>

  <!-- Top badge -->
  <g transform="translate(960,150)">
    <rect x="-230" y="-34" width="460" height="68" rx="34" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
    <text x="0" y="12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="6">LIMITED TIME OFFER</text>
  </g>

  <!-- Headline -->
  <text x="960" y="360" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="118" font-weight="800" fill="url(#titleGrad)">Get Your First Website</text>

  <!-- Subtitle -->
  <text x="960" y="430" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="400" fill="#ffffff" opacity="0.85">Professional. Fast. Affordable.</text>

  <!-- Price -->
  <g transform="translate(960,600)">
    <text x="-170" y="0" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffe66d">Rs.</text>
    <text x="-120" y="0" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="150" font-weight="900" fill="#ffe66d" filter="url(#glow)">10,000</text>
  </g>

  <!-- Features -->
  <g transform="translate(960,720)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#ffffff" opacity="0.9">
    <g transform="translate(-420,0)">
      <text x="0" y="0" fill="#4ecdc4" font-weight="900" font-size="34">✓</text>
      <text x="40" y="0" font-weight="500">Responsive Design</text>
    </g>
    <g transform="translate(-80,0)">
      <text x="0" y="0" fill="#4ecdc4" font-weight="900" font-size="34">✓</text>
      <text x="40" y="0" font-weight="500">SEO Ready</text>
    </g>
    <g transform="translate(230,0)">
      <text x="0" y="0" fill="#4ecdc4" font-weight="900" font-size="34">✓</text>
      <text x="40" y="0" font-weight="500">Fast Delivery</text>
    </g>
  </g>

  <!-- CTA button -->
  <g transform="translate(960,860)" filter="url(#softShadow)">
    <rect x="-260" y="-46" width="520" height="92" rx="20" fill="url(#ctaGrad)"/>
    <text x="0" y="12" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="1">Start Now — Contact Us</text>
  </g>

  <!-- Footer -->
  <text x="960" y="1030" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0.55" letter-spacing="3">www.apnaitonline.com   •   +91 8504985149</text>
</svg>
